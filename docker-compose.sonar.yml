# SonarQube Community + Postgres. Lancer : docker compose -f docker-compose.sonar.yml up -d
# Puis http://localhost:9000  (identifiants initiaux de SonarQube : à CHANGER immédiatement au 1er login)
# Définir avant : export SONAR_DB_PASSWORD=<mot de passe long et aléatoire>
# PRÉREQUIS WSL (Elasticsearch) :  sudo sysctl -w vm.max_map_count=524288
services:
  sonar-db:
    image: postgres:16-alpine
    container_name: sonar-db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:?définis SONAR_DB_PASSWORD}
      POSTGRES_DB: sonar
    volumes:
      - sonar-db-data:/var/lib/postgresql/data

  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    depends_on:
      - sonar-db
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:?définis SONAR_DB_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"   # SECURITE : uniquement en local
    volumes:
      - sonar-data:/opt/sonarqube/data
      - sonar-extensions:/opt/sonarqube/extensions
      - sonar-logs:/opt/sonarqube/logs

volumes:
  sonar-db-data:
  sonar-data:
  sonar-extensions:
  sonar-logs:
