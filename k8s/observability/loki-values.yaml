# Loki en mode monolithique (1 pod, stockage fichier) : suffisant pour un TP.
deploymentMode: Monolithic
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage:
    type: filesystem
  limits_config:
    allow_structured_metadata: true
    retention_period: 72h
  pattern_ingester:
    enabled: false
singleBinary:
  replicas: 1
  persistence:
    enabled: false          # emptyDir : les logs disparaissent si le pod redémarre (OK TP)
  resources:
    requests: {cpu: 50m, memory: 200Mi}
    limits: {memory: 512Mi}
write: {replicas: 0}
read: {replicas: 0}
backend: {replicas: 0}
gateway: {enabled: false}      # le service "loki" expose directement le port 3100
chunksCache: {enabled: false}
resultsCache: {enabled: false}
lokiCanary: {enabled: false}
test: {enabled: false}
monitoring:
  selfMonitoring: {enabled: false}
  serviceMonitor: {enabled: false}
