# kind create cluster --name catalog --config k8s/kind-config.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080   # NodePort de l'app  -> http://localhost:8080
        hostPort: 8080
        listenAddress: "127.0.0.1"   # SECURITE : jamais 0.0.0.0 (sinon accessible depuis le réseau)
      - containerPort: 30090   # Grafana -> http://localhost:9090
        hostPort: 9090
        listenAddress: "127.0.0.1"
