apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8srequireresources
  annotations:
    description: "Exige resources.requests et resources.limits (cpu ET memory) sur chaque conteneur."
spec:
  crd:
    spec:
      names:
        kind: K8sRequireResources
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8srequireresources

        containers[c] { c := input.review.object.spec.containers[_] }
        containers[c] { c := input.review.object.spec.initContainers[_] }
        containers[c] { c := input.review.object.spec.template.spec.containers[_] }
        containers[c] { c := input.review.object.spec.template.spec.initContainers[_] }

        required := [
          {"kind": "requests", "res": "cpu"},
          {"kind": "requests", "res": "memory"},
          {"kind": "limits", "res": "cpu"},
          {"kind": "limits", "res": "memory"},
        ]

        violation[{"msg": msg}] {
          c := containers[_]
          r := required[_]
          not c.resources[r.kind][r.res]
          msg := sprintf("le conteneur <%v> doit définir resources.%v.%v", [c.name, r.kind, r.res])
        }
