{{- if .Values.mongo.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-mongo
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: catalog-mongo
    {{- include "catalog.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog-mongo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog-mongo
        {{- include "catalog.labels" . | nindent 8 }}
    spec:
      containers:
        - name: mongo
          image: {{ .Values.mongo.image }}
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: data
              mountPath: /data/db
          resources:
            {{- toYaml .Values.mongo.resources | nindent 12 }}
      volumes:
        - name: data
          emptyDir: {}   # données perdues si le pod redémarre : OK pour un TP (sinon PVC)
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-mongo
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: catalog-mongo
    {{- include "catalog.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: catalog-mongo
  ports:
    - port: 27017
      targetPort: 27017
{{- end }}
