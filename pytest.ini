[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
addopts =
    --cov=app                    # Mesure la couverture sur tout le dossier "app"
    --cov-report=term-missing    # Affiche le rapport dans le terminal (avec les lignes manquantes)
    --cov-report=xml             # Génère un fichier coverage.xml (utile pour les outils tiers comme SonarQube ou GitHub Actions)
    --cov-report=html            #  Demande de générer un rapport visuel complet dans un dossier "htmlcov"
    --cov-fail-under=85          # Fait échouer les tests si la couverture globale descend en dessous de 85%
