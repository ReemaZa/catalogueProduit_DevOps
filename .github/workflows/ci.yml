name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE_NAME: catalogue-produit

jobs:
  # 1) Lint + tests (cloud GitHub) -------------------------------------------
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests + couverture (échoue si < 85 %)
        run: pytest

  # 2) Build + Trivy + Push (cloud GitHub) -----------------------------------
  build:
    name: Build, Trivy & Push
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Calcul du nom d'image (GHCR exige des minuscules)
        id: meta
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${OWNER}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build de l'image
        run: docker build -t "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}" .
      - name: Trivy (CRITICAL = échec du pipeline)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            ghcr.io/aquasecurity/trivy:0.76.2 image \
            --severity CRITICAL --exit-code 1 --ignore-unfixed \
            "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"
      - name: Login GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
      - name: Push
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: docker push "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"

  # 3) GitOps : la CI écrit le nouveau tag dans Git, ArgoCD déploie ------------
  update-manifest:
    name: Mise à jour du tag dans Git (GitOps)
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Met à jour values.yaml
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          sed -i "s|^  repository:.*|  repository: ghcr.io/${OWNER}/${IMAGE_NAME}|" helm/catalog/values.yaml
          sed -i "s|^  tag:.*|  tag: \"${{ needs.build.outputs.tag }}\"|" helm/catalog/values.yaml
      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/catalog/values.yaml
          git diff --cached --quiet || git commit -m "chore(gitops): image tag ${{ needs.build.outputs.tag }} [skip ci]"
          git push
