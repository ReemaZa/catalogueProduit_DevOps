# Lance MongoDB en local pour le développement : docker compose up -d
services:
  mongo:
    image: mongo:7
    container_name: catalog-mongo
    ports:
      - "127.0.0.1:27017:27017"   # SECURITE : MongoDB sans auth, uniquement en local
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
