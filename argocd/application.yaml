# kubectl apply -f argocd/application.yaml   (après avoir remplacé ReemaZa)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: catalog
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ReemaZa/catalogueProduit_DevOps.git
    targetRevision: main
    path: helm/catalog
    helm:
      valueFiles: [values.yaml]
  destination:
    server: https://kubernetes.default.svc
    namespace: catalog
  syncPolicy:
    automated:
      prune: true      # supprime ce qui n'est plus dans Git
      selfHeal: true   # annule toute modification manuelle du cluster
    syncOptions:
      - CreateNamespace=true
